name: Deploy to GitHub Pages

# 推送到 main 自动构建并发布到 GitHub Pages（构建类型：GitHub Actions）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新推送取消旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 引擎自测
        run: npm test
      - name: 构建
        run: npm run build
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 首次部署自动创建 Pages 站点（GITHUB_TOKEN 具备 pages:write）
          enablement: true
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
